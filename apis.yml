apis:
  - aid: upmc:cures-act-developer-api
    name: UPMC Health Plan ONC 21st Century Cures Act Developer API
    tags:
      - FHIR
      - Patient Access
      - Healthcare
      - Health Insurance
      - Cures Act
      - HL7
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://www.upmchealthplan.com/
    properties:
      - url: https://www.upmchealthplan.com/
        type: Documentation
    description: >-
      The UPMC Health Plan Developer API is the payer-side FHIR API mandated
      by the ONC 21st Century Cures Act and the CMS Interoperability and
      Patient Access Final Rule. It allows registered third-party applications
      to retrieve a member's clinical (USCDI) and claims data on the member's
      behalf using SMART-on-FHIR / OAuth 2.0 authorization. The API surface
      includes the Patient Access API (clinical + claims) and the Provider
      Directory API. UPMC Health Plan exposes a public link to the developer
      API resource center in the footer of every page on upmchealthplan.com.
